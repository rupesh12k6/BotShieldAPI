version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: botshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-BOTSHIELD}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-BOTSHIELD}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - botshield-network

  redis:
    image: redis:7-alpine
    container_name: botshield-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - botshield-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: botshield-api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8089}:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-BOTSHIELD}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SERVER_PORT: 8089
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - botshield-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  botshield-network:
    driver: bridge
